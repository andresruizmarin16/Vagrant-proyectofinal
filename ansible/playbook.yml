- hosts: all
  become: yes
  tasks:
    - name: Install Docker
      apt:
        name:
          - docker.io
          - docker-compose
        state: present
        update_cache: yes

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Include webserver tasks
      include_tasks: webserver.yml
      when: server_role == "webserver"

    - name: Include database tasks
      include_tasks: database.yml
      when: server_role == "database"
