- hosts: webserver  
  become: yes       
  tasks:            
    - name: Pull Nginx image
      docker_image:
        name: nginx
        tag: latest
        source: pull

    - name: Run Nginx container
      docker_container:
        name: nginx
        image: nginx:latest
        ports:
          - "80:80"
        state: started

    - name: Allow HTTP traffic
      ufw:
        rule: allow
        port: 80
        proto: tcp
